<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sednawy Hospital Report</title>

    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css" rel="stylesheet">

    <style>
        html, body { margin: 0; height: 100%; background: #eef0f2; }
        /* بدون ارتفاع محدد الكتاب بيظهر فاضي */
        #my_book { width: 100%; height: 100vh; }
        #file-warning {
            display: none; margin: 40px auto; max-width: 560px; padding: 20px;
            background: #fff3cd; border: 1px solid #e0c36a; border-radius: 8px;
            font-family: Tahoma, Arial, sans-serif; line-height: 1.8; color: #5c4a00;
        }
        #file-warning code { direction: ltr; display: inline-block; background: #fff; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="file-warning">
        الصفحة مفتوحة مباشرة من الجهاز (<code>file://</code>) والمتصفح بيمنع تحميل ملف الـ PDF بهذه الطريقة.<br>
        ارفع <code>index.html</code> و <code>book.pdf</code> في نفس المجلد على استضافة (GitHub Pages / Netlify)،
        أو شغّل سيرفر محلي: <code>python -m http.server 8000</code> ثم افتح <code>http://localhost:8000</code>
    </div>

    <div class="_df_book" id="my_book" source="book-1.pdf"></div>

    <script>
        if (location.protocol === 'file:') {
            document.getElementById('file-warning').style.display = 'block';
        }
        // لازم يتعرف قبل تحميل dflip.min.js
        var option_my_book = {
            direction: 2,        // 2 = من اليمين لليسار
            webgl: false,        // أكثر ثباتاً على كل الأجهزة
            height: '100%',
            autoEnableOutline: false,
            autoEnableThumbnail: false,
            pageMode: 0          // 0 = تلقائي (صفحة واحدة على الموبايل)
        };
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>
</body>
</html>
